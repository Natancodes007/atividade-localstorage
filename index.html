<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preferência de Tema</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.3s;
    }

    .light-mode {
      background: #f5f5f5;
      color: #222;
    }

    .dark-mode {
      background: #1e1e1e;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 450px;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      background: white;
    }

    .dark-mode .container {
      background: #2d2d2d;
    }

    h1 {
      margin-bottom: 15px;
    }

    p {
      margin-bottom: 20px;
    }

    button {
      border: none;
      padding: 12px 18px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #btnTema {
      background: #2563eb;
      color: white;
    }

    #btnSalvar {
      background: #16a34a;
      color: white;
    }

    #btnLimpar {
      background: #777;
      color: white;
    }

    #jsonExibido {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #111;
      color: #00ff66;
      text-align: left;
      word-break: break-word;
      font-family: monospace;
    }
  </style>
</head>

<body class="light-mode">

  <div class="container">

    <h1>🎨 Preferência de Tema</h1>

    <p>Escolha o tema e salve sua preferência no navegador.</p>

    <button id="btnTema">
      🌙 Alternar Tema
    </button>

    <br>

    <button id="btnSalvar">
      ✅ SALVAR NO NAVEGADOR
    </button>

    <button id="btnLimpar">
      🗑️ Limpar Preferência
    </button>

    <div id="jsonExibido">
      Nenhuma preferência salva.
    </div>

  </div>

  <script>

    const body = document.body;
    const btnTema = document.getElementById("btnTema");
    const btnSalvar = document.getElementById("btnSalvar");
    const btnLimpar = document.getElementById("btnLimpar");
    const jsonExibido = document.getElementById("jsonExibido");

    // Alternar entre claro e escuro
    btnTema.addEventListener("click", function() {

      if (body.classList.contains("light-mode")) {
        body.classList.remove("light-mode");
        body.classList.add("dark-mode");
      } else {
        body.classList.remove("dark-mode");
        body.classList.add("light-mode");
      }

    });


    // Salvar preferência no LocalStorage
    btnSalvar.addEventListener("click", function() {

      let temaAtual;

      if (body.classList.contains("dark-mode")) {
        temaAtual = "escuro";
      } else {
        temaAtual = "claro";
      }

      const preferencia = {
        tema: temaAtual,
        dataModificacao: new Date().toISOString()
      };

      // Objeto JavaScript → String JSON
      const preferenciaString = JSON.stringify(preferencia);

      // Salvar no LocalStorage
      localStorage.setItem(
        "preferencia_tema",
        preferenciaString
      );

      // Mostrar o JSON na tela
      jsonExibido.textContent = preferenciaString;

      alert("Preferência salva no navegador!");
    });


    // Carregar preferência quando a página abrir
    window.onload = function() {

      const preferenciaString =
        localStorage.getItem("preferencia_tema");

      if (preferenciaString) {

        // String JSON → Objeto JavaScript
        const preferencia =
          JSON.parse(preferenciaString);

        // Aplicar tema salvo
        if (preferencia.tema === "escuro") {

          body.classList.remove("light-mode");
          body.classList.add("dark-mode");

        } else {

          body.classList.remove("dark-mode");
          body.classList.add("light-mode");

        }

        // Mostrar JSON na tela
        jsonExibido.textContent = preferenciaString;
      }
    };


    // Limpar preferência
    btnLimpar.addEventListener("click", function() {

      localStorage.removeItem("preferencia_tema");

      location.reload();

    });

  </script>

</body>
</html>
